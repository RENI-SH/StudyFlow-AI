<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study Summary - StudyFlow AI</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #333; padding: 40px 20px; min-height: 100vh; margin:0; }
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { color: #667eea; text-align: center; font-size: 2.8em; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 1.3em; }
        .content-area h2 { color: #764ba2; border-bottom: 2px solid #667eea; padding-bottom: 8px; margin: 20px 0 15px 0; font-size: 2em; }
        .content-area h3 { color: #667eea; margin: 20px 0 10px 0; font-size: 1.4em; }
        .content-area p { line-height: 1.4; margin-bottom: 3px; font-size: 0.95em; }
        .content-area i { color: #444; background: #f0f4ff; padding: 5px 10px; border-radius: 5px; display: block; margin: 5px 0; font-size: 0.95em; }
        .content-area b { color: #000; font-size: 0.95em; }
        sub { font-size: 0.75em; vertical-align: sub; }
        .back-btn { display: inline-block; background: #6c757d; color: white; padding: 10px 25px; text-decoration: none; border-radius: 20px; margin-bottom: 20px; font-size: 1em; }
        .loader { text-align: center; margin-top: 50px; }
        .spinner { border: 4px solid rgba(102, 126, 234, 0.3); border-radius: 50%; border-top: 4px solid #667eea; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div style="position: fixed; left: 0; top: 0; width: 220px; height: 100%; background: rgba(0,0,0,0.8); color: white; padding: 20px; box-sizing: border-box; z-index: 1000;">
    <h3 style="color: #fff; border-bottom: 1px solid #555; padding-bottom: 10px;">StudyFlow AI</h3>
    <p style="font-size: 0.9em; opacity: 0.7;">Hello, {{ username }}</p>
    <ul style="list-style: none; padding: 0; margin-top: 30px;">
        <li style="margin: 15px 0;"><a href="/dashboard" style="color: white; text-decoration: none; font-size: 1.1em;"> Dashboard</a></li>
        <li style="margin: 15px 0;"><a href="/notefusion" style="color: white; text-decoration: none; font-size: 1.1em;">🧠 NoteFusion</a></li>
        <li style="margin: 15px 0;"><a href="/focus" style="color: white; text-decoration: none; font-size: 1.1em;">🎯 Focus Zone</a></li>
        <li style="margin: 15px 0;"><a href="/timetable" style="color: white; text-decoration: none; font-size: 1.1em;"> Timetable Generator</a></li>
        <li style="margin: 40px 0 0 0;"><a href="/logout" style="color: #ff4757; text-decoration: none; font-size: 1em;"> Logout</a></li>
    </ul>
</div>
<div style="margin-left: 240px; padding: 20px;">
    <div class="container">
        <a href="/notefusion" class="back-btn">← Upload Another File</a>
        <h1>📚 Study Summary</h1>
        <p class="subtitle" id="titleDisplay">Your AI-Generated Study Guide</p>
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p style="margin-top: 20px; font-size: 1.2em; color: #666;">Loading your comprehensive study guide...</p>
        </div>
        <div class="content-area" id="contentArea" style="display: none;"></div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search); const subject = urlParams.get('subject'); const topic = urlParams.get('topic'); document.getElementById('titleDisplay').textContent = `${subject} - ${topic}`; document.title = `${subject} - StudyFlow AI`;
        fetch('/api/get-summary-data').then(response => response.json()).then(data => { document.getElementById('contentArea').innerHTML = data.html; document.getElementById('contentArea').style.display = 'block'; document.getElementById('loader').style.display = 'none'; }).catch(error => { document.getElementById('loader').innerHTML = '<p style="color:red;">Error loading content. Please try again.</p>'; });
    </script>
</div>
</body>
</html>
