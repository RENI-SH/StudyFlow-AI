<!DOCTYPE html>
<html>
<head>
    <title>Login - StudyFlow AI</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; width: 350px; }
        h2 { color: #764ba2; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 1.1em; cursor: pointer; margin-top: 10px; }
        .guest-btn { background: transparent; color: #667eea; border: 2px solid #667eea; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Sign In</h2>
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <a href="/guest"><button type="button" class="guest-btn">Continue as Guest</button></a>
    </div>
</body>
</html>
